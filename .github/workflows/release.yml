name: Create Release

on:
  push:
    branches:
      - release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract strings
      run: |
        PLUGIN_VERSION=$(grep -oP 'Version:\s*\K[^ ]+' frymo-translatepress-integration.php)
        echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_ENV

        RELEASE=$(cat release.md)
        RELEASE="${RELEASE//'%'/'%25'}"
        RELEASE="${RELEASE//$'\n'/'\n'}"
        RELEASE="${RELEASE//$'\r'/'\\r'}"
        RELEASE="${RELEASE//$'\\'/'\\'}"
        RELEASE="${RELEASE//$'\\n'/'n'}"
        RELEASE="${RELEASE//$'"'/'\"'}"
        RELEASE="${RELEASE//$'####'/''}"
        echo "RELEASE=$RELEASE" >> $GITHUB_ENV

    - name: Ensure release does not already exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ env.PLUGIN_VERSION }}"
        if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "::error::Release for tag $TAG already exists. Bump the version in frymo-translatepress-integration.php before releasing."
          exit 1
        fi

    - name: Remove unnecessary files and folders
      run: |
        rm -f package.json package-lock.json gulpfile.js .gitignore .gitattributes \
              inc/composer.json inc/composer.lock inc/elementor/assets/iconfont/prefix.css

        rm -rf .git .github .cursor .cursorignore \
              inc/elementor/assets/iconfont/svg inc/elementor/assets/style/scss

    - name: Move files to frymo-translatepress-integration folder
      run: |
        cd $GITHUB_WORKSPACE
        mkdir frymo-translatepress-integration
        shopt -s extglob
        mv -- !(frymo-translatepress-integration) frymo-translatepress-integration/

    - name: Zip files
      run: |
        cd $GITHUB_WORKSPACE
        zip -r frymo-translatepress-integration-${{ env.PLUGIN_VERSION }}.zip .
        cp frymo-translatepress-integration/changelog.md .
        rm -rf frymo-translatepress-integration

    - name: Create Release
      id: create-release
      uses: softprops/action-gh-release@v2.6.1
      with:
        tag_name: ${{ env.PLUGIN_VERSION }}
        name: Release ${{ env.PLUGIN_VERSION }}
        body_path: release.md
        draft: false
        prerelease: false
        target_commitish: ${{ github.sha }}
        files: frymo-translatepress-integration-${{ env.PLUGIN_VERSION }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send custom JSON data to Slack workflow
      id: slack
      uses: slackapi/slack-github-action@v3.0.1
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "blocks": [
              {
                "type": "divider"
              },
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Frymo TranslatePress Integration Version ${{ env.PLUGIN_VERSION }} released",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ env.RELEASE }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<https://github.com/frymo-de/frymo-translatepress-integration/blob/release/changelog.md | View full changelog>"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Download",
                      "emoji": true
                    },
                    "value": "download",
                    "url": "${{ steps.create-release.outputs.url }}"
                  }
                ]
              }
            ]
          }


  send-slack-message:
    needs: create-release
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
    - name: Send Slack Message
      uses: slackapi/slack-github-action@v3.0.1
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Frymo TranslatePress Integration Create Release* job failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | Details>"
                }
              }
            ]
          }
